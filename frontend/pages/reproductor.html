<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamHub — Reproductor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="player-body">
<div class="scene" aria-hidden="true">
    <div class="scene__glow"></div>
    <div class="scene__beam"></div>
    <div class="scene__grain"></div>
</div>

<header class="player-header glass-panel">
    <a href="home.html" class="brand player-header__brand">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__logo">Stream<span class="brand__accent">Hub</span></span>
    </a>

    <div class="player-header__actions">
    <a class="btn-home-nav" href="home.html">Volver</a>
    <button class="btn-home-nav btn-home-nav--ghost" id="btn-fav" type="button">Agregar a favoritos</button>
    </div>
</header>

<main class="player-shell">
    <section class="player-stage">
    <div class="player-screen glass-panel">
        <video id="video" class="player-video" controls preload="metadata" poster="">
        Tu navegador no soporta el video.
        </video>

        <div class="player-screen__overlay">
        <span class="player-pill" id="video-badge">Estreno</span>
        <button class="player-play" id="playBtn" type="button">▶ Reproducir</button>
        </div>
    </div>

    <div class="player-meta glass-panel">
        <div class="player-meta__top">
        <div>
            <p class="player-eyebrow" id="video-genre">Ciencia ficción</p>
            <h1 id="video-title">Neon Horizon</h1>
        </div>
        <div class="player-meta__chips">
            <span class="player-chip" id="video-year">2024</span>
            <span class="player-chip" id="video-duration">2h 06m</span>
            <span class="player-chip" id="video-rating">★ 8.9</span>
        </div>
        </div>

        <p class="player-description" id="video-description">
        Una corredora de alto riesgo se ve atrapada en una red orbital que amenaza la Tierra.
        </p>

        <div class="player-actions">
        <button class="btn-primary player-inline-btn" type="button">Reproducir ahora</button>
        <button class="btn-home-nav btn-home-nav--ghost" id="btn-dislike" type="button">Dar dislike</button>
        <button class="btn-home-nav btn-home-nav--ghost" type="button">Trailers</button>
        </div>
    </div>
    </section>

    <aside class="player-sidebar">
    <div class="player-card glass-panel">
        <h2>Detalles de la película</h2>

        <div class="player-info-list">

            <div class="player-info-item">
                <span>Categoría</span>
                <strong id="detalle-categoria">-</strong>
            </div>

            <div class="player-info-item">
                <span>Año</span>
                <strong id="detalle-anio">-</strong>
            </div>

            <div class="player-info-item">
                <span>Duración</span>
                <strong id="detalle-duracion">-</strong>
            </div>

        </div>
    </div>

    </aside>
</main>

<script src="../js/api.js"></script>
<script src="../js/reproductor.js"></script>
</body>
</html>
