<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFlix · Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-body">

  <!-- Mismo fondo ambiental que el login: resplandor + grano de película -->
  <div class="scene" aria-hidden="true">
    <div class="scene__glow"></div>
    <div class="scene__beam"></div>
    <div class="scene__grain"></div>
  </div>

  <main class="auth-wrapper">
    <section class="auth-card" aria-labelledby="registerTitle">

      <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__logo">Stream<span class="brand__accent">Hub</span></span>
      </a>

      <h1 id="registerTitle" class="auth-card__title">Crear cuenta</h1>
      <p class="auth-card__subtitle">Regístrate para empezar a disfrutar StreamHub.</p>

      <!-- Banner de éxito, oculto hasta que el registro se complete -->
      <div class="form-success" id="formSuccess" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m4 12.5 5 5L20 7"/>
        </svg>
        <span>Cuenta creada correctamente</span>
      </div>

      <form id="registerForm" class="auth-form" novalidate>

        <div class="field-group" data-field="nombre">
          <label for="nombre" class="field-label">Nombre completo</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="8" r="3.5"/>
                <path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/>
              </svg>
            </span>
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="field-input"
              placeholder="Ej. Ana Torres"
              autocomplete="name"
            />
          </div>
          <span class="field-error" id="nombreError" role="alert"></span>
        </div>

        <div class="field-group" data-field="email">
          <label for="email" class="field-label">Correo electrónico</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/>
                <path d="m4 6.5 8 6 8-6"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              class="field-input"
              placeholder="tucorreo@ejemplo.com"
              autocomplete="email"
              inputmode="email"
            />
          </div>
          <span class="field-error" id="emailError" role="alert"></span>
        </div>

        <div class="field-group" data-field="password">
          <label for="password" class="field-label">Contraseña</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="field-input"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.4 4.4M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert"></span>
        </div>

        <div class="field-group" data-field="confirmPassword">
          <label for="confirmPassword" class="field-label">Confirmar contraseña</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
              </svg>
            </span>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="field-input"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.4 4.4M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="confirmPasswordError" role="alert"></span>
        </div>

        <div class="field-group" data-field="region">
          <label for="region" class="field-label">Región</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="12" r="8.5"/>
                <path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5Z"/>
              </svg>
            </span>
            <select id="region" name="region" class="field-input field-select" required>
              <option value="" disabled selected>Selecciona tu región</option>
              <option value="CO">Colombia</option>
              <option value="US">Estados Unidos</option>
              <option value="MX">México</option>
              <option value="AR">Argentina</option>
              <option value="ES">España</option>
            </select>
            <span class="select-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
          </div>
          <span class="field-error" id="regionError" role="alert"></span>
        </div>

        <div class="field-group terms-group" data-field="terms">
          <label class="checkbox">
            <input type="checkbox" id="terms" name="terms" />
            <span class="checkbox__box" aria-hidden="true"></span>
            <span class="checkbox__label">
              Acepto los <a href="#" class="link-muted">términos y condiciones</a>
            </span>
          </label>
          <span class="field-error" id="termsError" role="alert"></span>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">
          <span>Crear cuenta</span>
        </button>
      </form>

      <p class="auth-card__footer">
        ¿Ya tienes cuenta? <a href="index.html" class="link-accent">Iniciar sesión</a>
      </p>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/registro.js"></script>
</body>
</html>
