<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamFlix · Recuperar contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="auth-body">
<div class="scene" aria-hidden="true">
    <div class="scene__glow"></div>
    <div class="scene__beam"></div>
    <div class="scene__grain"></div>
</div>

<main class="auth-wrapper">
    <section class="auth-card" aria-labelledby="resetTitle">
    <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__logo">Stream<span class="brand__accent">Hub</span></span>
    </a>

    <h1 id="resetTitle" class="auth-card__title">Recuperar contraseña</h1>
    <p class="auth-card__subtitle auth-card__subtitle--compact">Ingresa tu correo registrado y define una nueva contraseña.</p>

    <div class="form-message" id="formMessage" role="status" aria-live="polite"></div>

    <form id="resetPasswordForm" class="auth-form" novalidate>
        <div class="field-group" data-field="email">
        <label for="email" class="field-label">Correo electrónico</label>
        <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/>
                <path d="m4 6.5 8 6 8-6"/>
            </svg>
            </span>
            <input
            type="email"
            id="email"
            name="email"
            class="field-input"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            inputmode="email"
            />
        </div>
        <span class="field-error" id="emailError" role="alert"></span>
        </div>

        <div class="field-group" data-field="password">
        <label for="password" class="field-label">Nueva contraseña</label>
        <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
            </svg>
            </span>
            <input
            type="password"
            id="password"
            name="password"
            class="field-input"
            placeholder="Ingresa una nueva contraseña"
            autocomplete="new-password"
            />
            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.4 4.4M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
            </button>
        </div>
        <span class="field-error" id="passwordError" role="alert"></span>
        </div>

        <div class="field-group" data-field="confirmPassword">
        <label for="confirmPassword" class="field-label">Confirmar contraseña</label>
        <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/>
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
            </svg>
            </span>
            <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="field-input"
            placeholder="Repite la nueva contraseña"
            autocomplete="new-password"
            />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.4 4.4M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </svg>
            </button>
        </div>
        <span class="field-error" id="confirmPasswordError" role="alert"></span>
        </div>

        <button type="submit" class="btn-primary" id="resetBtn">
        <span>Actualizar contraseña</span>
        </button>
    </form>

    <p class="auth-card__footer">
        ¿Recordaste tu contraseña? <a href="index.html" class="link-accent">Volver al login</a>
    </p>
    </section>
</main>

<script src="../js/restContraseña.js"></script>
</body>
</html>
