services:

  db:
    image: mysql:8.0
    container_name: cineapp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cineapp2026
      MYSQL_DATABASE: ott_mvp
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -pcineapp2026]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: sebastianrendon/cineapp-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineapp_backend
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: cineapp2026
      DB_NAME: ott_mvp
      SECRET_KEY: cineapp_secret_2026_paradigmas_ott
    ports:
      - 5000:5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: sebastianrendon/cineapp-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineapp_frontend
    restart: always
    ports:
      - 80:80
    depends_on:
      - backend

  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    container_name: cineapp_playwright
    working_dir: /app
    volumes:
      - ./frontend/tests:/app/tests
      - ./playwright.config.js:/app/playwright.config.js
    command: npx playwright test
    network_mode: host
    depends_on:
      - frontend
      - backend
    profiles:
      - testing

volumes:
  db_data:
